name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "linux-gcc",   os: ubuntu-24.04, preset: release, cc: gcc-13,   cxx: g++-13 }
          - { name: "linux-clang", os: ubuntu-24.04, preset: release, cc: clang-18, cxx: clang++-18 }
          - { name: "macos-clang", os: macos-14,     preset: release, cc: clang,    cxx: clang++ }
          - { name: "windows-msvc", os: windows-2022, preset: msvc }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (non-Windows)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ninja-build; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ninja; fi
        shell: bash

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} ${{ runner.os == 'Windows' && '--config Release' || '' }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # ---------------------------------------------------------------------------
  # M3 seam flags-ON build leg. Configures + builds with the HTTP/3 and WebRTC
  # seams ENABLED so the ON path (stub TUs + the App seam hook + the flag-gated
  # seam test) can't rot. Build + run the seam test; the stubs return
  # NotImplemented, so there's nothing more to assert at runtime than the
  # registry mechanism. MSVC (VS2022) per Windows toolchain policy — never MinGW.
  # ---------------------------------------------------------------------------
  seams-on:
    name: seams-on (windows-msvc, HTTP3+WebRTC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (seams ON)
        run: >
          cmake -S . -B build/proto -G "Visual Studio 17 2022" -A x64
          -DBOLTAPI_WITH_HTTP3=ON -DBOLTAPI_WITH_WEBRTC=ON

      - name: Build
        run: cmake --build build/proto --config Release

      - name: Test (seam test only; full suite covered by build-test)
        run: ctest --test-dir build/proto -C Release --output-on-failure -R ProtocolSeam

  # ---------------------------------------------------------------------------
  # ASan + UBSan (Linux/clang). Exercises the full suite instrumented; this is
  # where MSVC's local ASan-runtime gap is covered.
  # ---------------------------------------------------------------------------
  asan:
    name: asan (ubuntu-clang-18)
    runs-on: ubuntu-24.04
    env:
      CC:  clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure (ASan/UBSan)
        # Exercise the opt-in bolt::Arena request-body path under ASan/UBSan: the
        # whole-arena per-request reset is the high-risk swap, so we want
        # use-after-reset / lifetime bugs caught here on Linux clang.
        run: >
          cmake -S . -B build/asan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBOLTAPI_SANITIZE=ON
          -DBOLTAPI_USE_BOLT_ARENA=ON

      - name: Build
        run: cmake --build build/asan

      - name: Test
        env:
          # Halt on first error; print full reports; symbolize frames.
          ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:print_stacktrace=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/asan --output-on-failure

  # ---------------------------------------------------------------------------
  # Debug build with assertions enabled — TigerStyle invariants must hold under
  # the full suite (asserts are compiled out of Release).
  # ---------------------------------------------------------------------------
  assertions:
    name: assertions (ubuntu-debug)
    runs-on: ubuntu-24.04
    env:
      CC:  clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure (Debug, asserts on)
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        # No testPreset for debug; drive ctest against the debug binary dir.
        run: ctest --test-dir build/debug --output-on-failure
